# Mosquitto Sentinel-X (fusion config Baptiste + infra)
persistence true
persistence_location /mosquitto/data/

# Logs vers stdout (rotation gérée par Docker : 3 x 10 Mo)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Port 1883 en clair désactivé : unique listener MQTTS
listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/mosquitto.crt
keyfile  /mosquitto/certs/mosquitto.key
tls_version tlsv1.2
require_certificate false

# Authentification obligatoire + droits par compte
allow_anonymous false
password_file /mosquitto/config/password.txt
acl_file      /mosquitto/config/acl

# Limites anti-DoS
max_connections 20
message_size_limit 8192
max_inflight_messages 20
max_queued_messages 100
