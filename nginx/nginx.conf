# Reverse proxy Sentinel-X (base : Baptiste) — seul point d'entrée HTTP(S)
events {
    worker_connections 1024;
}

http {
    # Durcissement : masquer la version de Nginx
    server_tokens off;

    # DNS interne Docker : Nginx démarre même si backend/frontend n'existent pas encore
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Protection DoS / brute-force : 10 requêtes/s par IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # WebSocket (temps réel du dashboard)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirection HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name dashboard.sentinel.lan localhost;

        ssl_certificate     /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;
        ssl_dhparam         /etc/nginx/certs/dhparam.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # En-têtes de sécurité
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy "no-referrer" always;

        # Ports internes à confirmer avec les devs
        set $backend  http://sentinel-backend:5678;
        set $frontend http://sentinel-frontend:5678;

        # API : le chemin complet /api/v1/... est transmis tel quel au backend
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WebSocket du backend (socket.io, chemin par défaut /socket.io/)
        location /socket.io/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;    # > intervalle de ping socket.io (25 s)
        }

        location / {
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
